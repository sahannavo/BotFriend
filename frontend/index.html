<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 BotFriend - Your AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="header-content">
          <h1>🤖 BotFriend</h1>
          <span class="status-badge">● Online</span>
        </div>
        <p class="subtitle">Your helpful and funny AI assistant</p>
      </header>

      <!-- Chat Messages Area -->
      <div id="chat-box" class="chat-box">
        <!-- Messages will appear here -->
        <div class="message bot-message">
          <div class="avatar">🤖</div>
          <div class="message-content">
            <p>
              Hi there! I'm BotFriend! Ask me anything or just chat with me 😊
            </p>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message here..."
          autofocus
        />
        <button id="send-btn" class="send-btn">
          <span>Send</span>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
          </svg>
        </button>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <span>BotFriend is typing</span>
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
